name: x86 bench 583 vs v2.0.0
on:
  push:
    branches: [vm-tools/x86-583]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench583:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: free disk and use a leaner linker
        uses: ./.github/actions/linux-build-prep
      - name: run x86-64 ABBA vs v2.0.0 (both layouts + Python wheels)
        run: bash vm-tools/stage2-583/run_x86_583.sh "$RUNNER_TEMP/x86-583" 6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: x86-583-out
          path: ${{ runner.temp }}/x86-583/out/
